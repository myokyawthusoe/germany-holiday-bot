<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Reminder Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            --bg-gradient: linear-gradient(135deg, #f5f3ff 0%, #e0e7ff 100%);
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --radius: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg-gradient); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; color: var(--text-main); }

        .card { width: 100%; max-width: 480px; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border-radius: var(--radius); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.04); overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.8); }

        .header { background: var(--primary-gradient); color: white; padding: 24px; text-align: center; }
        .header h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
        .header p { font-size: 13px; opacity: 0.9; }

        /* Tabs Switcher */
        .tabs { display: flex; background: #f3f4f6; padding: 6px; gap: 6px; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: transparent; font-size: 13px; font-weight: 600; color: var(--text-muted); border-radius: 10px; cursor: pointer; transition: all 0.3s ease; }
        .tab-btn.active { background: white; color: var(--primary); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }

        /* Form Sections */
        .form-section { padding: 24px; display: none; }
        .form-section.active { display: block; animation: fadeIn 0.4s ease; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #374151; }
        
        select, input, textarea { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; background: #f9fafb; transition: all 0.2s; outline: none; }
        select:focus, input:focus, textarea:focus { border-color: var(--primary); background: white; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }

        .info-box { background: #eef2ff; border-left: 4px solid var(--primary); padding: 10px 12px; border-radius: 8px; font-size: 12px; color: #4338ca; margin-bottom: 14px; line-height: 1.4; }

        .btn-submit { width: 100%; padding: 12px; background: var(--primary-gradient); color: white; border: none; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer; transition: opacity 0.2s; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2); }
        .btn-submit:hover { opacity: 0.95; }

        .btn-unsub { width: 100%; padding: 10px; background: transparent; color: #ef4444; border: 1px solid #fee2e2; border-radius: 10px; font-weight: 600; font-size: 13px; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
        .btn-unsub:hover { background: #fef2f2; }

        #statusMsg {
