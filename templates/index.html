<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Assistant Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 480px; background: white; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden; padding: 25px; }
        
        h2 { text-align: center; color: #1a1a1a; font-size: 22px; margin-bottom: 20px; font-weight: 700; }
        
        /* Tab Switcher Styling */
        .tab-container { display: flex; background: #edf2f7; border-radius: 10px; padding: 4px; margin-bottom: 25px; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: transparent; font-weight: 600; font-size: 14px; cursor: pointer; border-radius: 8px; transition: all 0.3s ease; color: #4a5568; }
        .tab-btn.active { background: white; color: #0066cc; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        
        /* Form Content */
        .form-section { display: none; animation: fadeIn 0.4s ease; }
        .form-section.active { display: block; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        label { display: block; font-weight: 600; font-size: 13px; color: #2d3748; margin-bottom: 6px; }
        select, input, textarea { width: 100%; padding: 12px; margin-bottom: 16px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 14px; background: #f8fafc; transition: all 0.2s; }
        select:focus, input:focus, textarea:focus { outline: none; border-color: #0066cc; background: white; box-shadow: 0 0 0 3px rgba(0,102,204,0.1); }
        
        .info-box { background: #ebf8ff; border-left: 4px solid #3182ce; padding: 10px 12px; border-radius: 0 8px 8px 0; font-size: 12px; color: #2b6cb0; margin-bottom: 16px; line-height: 1.5; }
        
        .btn-primary { width: 100%; padding: 12px; background: #0066cc; color: white; border: none; border-radius: 8px; font-weight: 600; font-size: 15px; cursor: pointer; transition: background 0.2s; margin-bottom: 10px; }
        .btn-primary:hover { background: #0052a3; }
        
        .btn-danger { width: 100%; padding: 10px; background: #fff5f5; color: #e53e3e; border: 1px solid #fed7d7; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; transition: all 0.2s; }
        .btn-danger:hover { background: #fee2e2; }
        
        #statusMsg { margin-top: 15px; font-weight: 600; font-size: 14px; text-align: center; }
    </style>
</head>
<body>

    <div class="container">
        <h2>✨ Smart Reminder Hub</h2>
        
        <!-- Tab Navigation Buttons -->
        <div class="tab-container">
            <button class="tab-btn active" onclick="switchTab('holiday')">🇩🇪 Holiday</button>
            <button class="tab-btn" onclick="switchTab('appointment')">📅 Appointment</button>
        </div>

        <!-- 1. Holiday Reminder Form -->
        <div id="holidaySection" class="form-section active">
            <form id="holidayForm">
                <label>Select your German State:</label>
                <select id="state" required>
                    <option value="" disabled selected>-- Choose State --</option>
                    <option value="BW">Baden-Württemberg</option>
                    <option value="BY">Bayern</option>
                    <option value="BE">Berlin</option>
                    <option value="BB">Brandenburg</option>
                    <option value="HB">Bremen</option>
                    <option value="HH">Hamburg</option>
                    <option value="HE">Hessen</option>
                    <option value="MV">Mecklenburg-Vorpommern</option>
                    <option value="NI">Niedersachsen</option>
                    <option value="NW">Nordrhein-Westfalen</option>
                    <option value="RP">Rheinland-Pfalz</option>
                    <option value="SL">Saarland</option>
                    <option value="SN">Sachsen</option>
                    <option value="ST">Sachsen-Anhalt</option>
                    <option value="SH">Schleswig-Holstein</option>
                    <option value="TH">Thüringen</option>
                </select>
                
                <label>Telegram Chat ID:</label>
                <div class="info-box">
                    📌 <b>Chat ID ရှာရန်:</b> Telegram တွင် <b>@userinfobot</b> သို့ <code>/start</code> ပို့၍ရသော ဂဏန်းနံပါတ်ကို ထည့်ပါ။
                </div>
                <input type="text" id="chatId" placeholder="e.g. 123456789" required>
                
                <button type="submit" class="btn-primary">Save Holiday Reminder</button>
                <button type="button" class="btn-danger" onclick="unsubscribeUser()">Unsubscribe</button>
            </form>
        </div>

        <!-- 2. Appointment Reminder Form -->
        <div id="appointmentSection" class="form-section">
            <form id="appointmentForm">
                <label>Telegram Chat ID:</label>
                <div class="info-box">
                    📌 Telegram တွင် <b>@userinfobot</b> သို့ <code>/start</code> ပို့၍ရသော ဂဏန်းနံပါတ်ကို ထည့်ပါ။
                </div>
                <input type="text" id="apptChatId" placeholder="e.g. 123456789" required>

                <label>Appointment Date:</label>
                <input type="date" id="apptDate" required>

                <label>Appointment Time (24-Hour Format):</label>
                <select id="apptTime" required>
                    <option value="" disabled selected>-- Select Time --</option>
                    <script>
                        for (let h = 0; h < 24; h++) {
                            for (let m = 0; m < 60; m += 30) {
                                let hh = String(h).padStart(2, '0');
                                let mm = String(m).padStart(2, '0');
                                document.write(`<option value="${hh}:${mm}">${hh}:${mm}</option>`);
                            }
                        }
                    </script>
                </select>

                <label>Appointment Details:</label>
                <textarea id="apptText" rows="3" placeholder="ဥပမာ - ဒေါက်တာပြရန်၊ ရုံးသွားရန်..." required></textarea>

                <button type="submit" class="btn-primary" style="background: #2f855a;">Save Appointment Reminder</button>
                <button type="button" class="btn-danger" onclick="unsubscribeUser()">Unsubscribe / Delete All</button>
            </form>
        </div>

        <p id="statusMsg"></p>
    </div>

    <script>
        // Tab Switcher Function
        function switchTab(tabName) {
            const holidaySec = document.getElementById('holidaySection');
            const apptSec = document.getElementById('appointmentSection');
            const buttons = document.querySelectorAll('.tab-btn');
            
            document.getElementById('statusMsg').innerText = '';

            if (tabName === 'holiday') {
                holidaySec.classList.add('active');
                apptSec.classList.remove('active');
                buttons[0].classList.add('active');
                buttons[1].classList.remove('active');
            } else {
                apptSec.classList.add('active');
                holidaySec.classList.remove('active');
                buttons[1].classList.add('active');
                buttons[0].classList.remove('active');
            }
        }

        // Holiday Form Submit
        document.getElementById('holidayForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const state = document.getElementById('state').value;
            const chatId = document.getElementById('chatId').value;

            const res = await fetch('/save', {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify({ state, chatId })
            });
            const result = await res.json();
            showStatus(result.success ? '🎉 Holiday Reminder Saved Successfully!' : 'Error occurred.', result.success);
        });

        // Appointment Form Submit
        document.getElementById('appointmentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const chatId = document.getElementById('apptChatId').value;
            const date = document.getElementById('apptDate').value;
            const time = document.getElementById('apptTime').value;
            const text = document.getElementById('apptText').value;

            const res = await fetch('/save_appointment', {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify({ chatId, date, time, text })
            });
            const result = await res.json();
            showStatus(result.success ? '📅 Appointment Reminder Saved Successfully!' : 'Error occurred.', result.success);
        });

        // Unsubscribe Function
        async function unsubscribeUser() {
            const chatId = document.getElementById('chatId').value || document.getElementById('apptChatId').value;
            if (!chatId) {
                showStatus('Please enter your Telegram Chat ID first!', false);
                return;
            }
            const res = await fetch('/unsubscribe', {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify({ chatId })
            });
            const result = await res.json();
            showStatus(result.success ? 'Successfully unsubscribed/deleted.' : 'Failed.', !result.success);
        }

        function showStatus(msg, success) {
            const msgEl = document.getElementById('statusMsg');
            msgEl.innerText = msg;
            msgEl.style.color = success ? '#2f855a' : '#e53e3e';
        }
    </script>
</body>
</html>
